[package]
name = "cloudreve-sdk-api"
version = "0.1.0"
edition = "2021"
description = "Async Rust client for the Cloudreve v4 API"
license = "MIT"
documentation = "https://docs.rs/cloudreve-sdk-api"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
async-trait = "0.1"
url = "2.5"
bytes = "1.5"
urlencoding = "2.1"
percent-encoding = "2.3"
anyhow = "1.0"
base64 = "0.22"

[dev-dependencies]
tokio-test = "0.4"

