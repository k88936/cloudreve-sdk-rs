[package]
name = "cloudreve-sdk-uploader"
version = "0.1.0"
edition = "2024"
description = "Provider-aware chunked file uploads for Cloudreve CLI clients"
license = "MIT"
documentation = "https://docs.rs/cloudreve-sdk-uploader"
readme = "README.md"

[dependencies]
aes = "0.8"
anyhow = "1.0"
base64 = "0.22"
bytes = "1.5"
chrono = { version = "0.4", features = ["serde"] }
cloudreve-sdk-api = { version = "0.1.0", path = "../cloudreve-sdk-api" }
ctr = "0.9"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
